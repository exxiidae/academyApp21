<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>TOP Academy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        h1 {
            color: #2c3e50;
        }

        table {
            border-collapse: collapse;
            background: #fff;
            margin-bottom: 30px;
            box-shadow: 0 2px 6px rgba(0,0,0,.1);
        }

        th, td {
            padding: 8px 16px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #2c3e50;
            color: #fff;
        }

        tr:hover {
            background: #f0f7ff;
        }

        #error {
            color: #c0392b;
        }

        .search-block {
            background: #fff;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,.1);
            max-width: 500px;
        }

            .search-block input {
                padding: 8px;
                font-size: 16px;
                width: 150px;
                margin-right: 10px;
            }

            .search-block button {
                padding: 8px 20px;
                font-size: 16px;
                background: #2c3e50;
                color: white;
                border: none;
                cursor: pointer;
                border-radius: 4px;
            }

                .search-block button:hover {
                    background: #1a252f;
                }

        #studentResult {
            margin-top: 15px;
            font-size: 16px;
            line-height: 1.6;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <h1>Список студентов</h1>
    <p id="error"></p>
    <table id="studentsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Фамилия</th>
                <th>Возраст</th>
                <th>GroupId</th>
            </tr>
        </thead>
        <tbody id="studentsBody"></tbody>
    </table>

    <h1>Список групп</h1>
    <table id="groupsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Название группы</th>
            </tr>
        </thead>
        <tbody id="groupsBody"></tbody>
    </table>

    
    <h1>Найти студента по ID</h1>
    <div class="search-block">
        <input type="number" id="searchId" placeholder="Введите ID" />
        <button onclick="loadStudentById()">🔍 Найти</button>
        <p id="studentResult"></p>
    </div>

    <script>
        
        async function loadStudents() {
            const errorEl = document.getElementById("error");
            const body = document.getElementById("studentsBody");
            try {
                const res = await fetch("/students/all");
                if (!res.ok) throw new Error("HTTP " + res.status);
                const students = await res.json();

                body.innerHTML = "";
                for (const s of students) {
                    body.innerHTML += `
                            <tr>
                                <td>${s.studentId}</td>
                                <td>${s.firstName}</td>
                                <td>${s.lastName}</td>
                                <td>${s.age}</td>
                                <td>${s.groupId}</td>
                            </tr>`;
                }
                errorEl.textContent = "";
            } catch (err) {
                errorEl.textContent = "Ошибка загрузки студентов: " + err.message;
            }
        }

        
        async function loadGroups() {
            const errorEl = document.getElementById("error");
            const body = document.getElementById("groupsBody");
            try {
                const res = await fetch("/groups/all");
                if (!res.ok) throw new Error("HTTP " + res.status);
                const groups = await res.json();

                body.innerHTML = "";
                for (const g of groups) {
                    body.innerHTML += `
                            <tr>
                                <td>${g.groupId}</td>
                                <td>${g.groupName}</td>
                            </tr>`;
                }
            } catch (err) {
                errorEl.textContent = "Ошибка загрузки групп: " + err.message;
            }
        }

        
        async function loadStudentById() {
            const id = document.getElementById("searchId").value;
            const result = document.getElementById("studentResult");

            if (!id) {
                result.textContent = "Введите ID!";
                return;
            }

            try {
                const res = await fetch(`/students/${id}`);

                if (res.status === 404) {
                    result.textContent = `❌ Студент с ID=${id} не найден`;
                    return;
                }
                if (!res.ok) throw new Error("HTTP " + res.status);

                const s = await res.json();
                result.innerHTML = `
                        <strong>✅ Найден студент:</strong><br>
                        ID: ${s.studentId}<br>
                        Имя: ${s.firstName}<br>
                        Фамилия: ${s.lastName}<br>
                        Возраст: ${s.age}<br>
                        GroupId: ${s.groupId}
                    `;
            } catch (err) {
                result.textContent = "Ошибка: " + err.message;
            }
        }

        
        loadStudents();
        loadGroups();
    </script>
</body>
</html>
