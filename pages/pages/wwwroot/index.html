<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>TOP Academy</title>
    <link rel="stylesheet" href="css/table.css" />
    <style>
        select { padding: 8px; font-size: 16px; margin-bottom: 10px; margin-right: 10px; border-radius: 4px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Список студентов</h1>
    <table>
        <thead>
            <tr><th>ID</th><th>Имя</th><th>Фамилия</th><th>Возраст</th><th>GroupId</th></tr>
        </thead>
        <tbody id="studentsBody"></tbody>
    </table>

    <h1>Список учителей</h1>
    <table>
        <thead>
            <tr><th>ID</th><th>Имя</th><th>Фамилия</th></tr>
        </thead>
        <tbody id="teachersBody"></tbody>
    </table>

    <h1>Добавить запись</h1>
    <div class="block">
        <label for="addType">Кого создать:</label>
        <select id="addType" onchange="toggleAddFields()">
            <option value="student">Студента</option>
            <option value="teacher">Учителя</option>
        </select>
        <br>
        
        <input type="text" id="addFirstName" placeholder="Имя" />
        <input type="text" id="addLastName" placeholder="Фамилия" />
        
        <div id="studentFields">
            <input type="number" id="addAge" placeholder="Возраст" />
            <input type="number" id="addGroupId" placeholder="GroupId" />
        </div>
        
        <button onclick="addEntity()">Добавить</button>
        <p id="addResult"></p>
    </div>

    <h1>Список групп</h1>
    <table>
        <thead>
            <tr><th>ID</th><th>Название группы</th></tr>
        </thead>
        <tbody id="groupsBody"></tbody>
    </table>

    <script src="js/routes.js"></script>
</body>
</html>
